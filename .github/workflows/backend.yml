name: Backend

on:
  push:
    branches: [main]
    paths:
      - server/**
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - server/**
      - .github/workflows/backend.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow token can only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: munchkin
          POSTGRES_PASSWORD: munchkin
          POSTGRES_DB: munchkin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U munchkin"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://munchkin:munchkin@localhost:5432/munchkin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  # The frontend deploys on its own (Cloudflare Pages), so ship the server
  # as soon as its tests pass to keep both sides of the protocol in sync.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-server.yml
    secrets: inherit
