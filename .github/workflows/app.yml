# Shared game logic (packages/core) and the Expo app (iOS / Android / web).
name: App

on:
  push:
    branches: [main]
    paths:
      - packages/**
      - apps/**
      - package.json
      - package-lock.json
      - .github/workflows/app.yml
  pull_request:
    paths:
      - packages/**
      - apps/**
      - package.json
      - package-lock.json
      - .github/workflows/app.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow token can only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Core
        run: npm run typecheck -w @munchkin/core && npm test -w @munchkin/core
      - name: App typecheck and lint
        run: npm run typecheck -w @munchkin/app && npm run lint -w @munchkin/app
      - name: App web build
        working-directory: apps/app
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
