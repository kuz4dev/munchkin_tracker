# The Vue web client, kept until the Expo app reaches feature parity.
name: Legacy web

on:
  push:
    branches: [main]
    paths:
      - legacy-web/**
      - .github/workflows/legacy-web.yml
  pull_request:
    paths:
      - legacy-web/**
      - .github/workflows/legacy-web.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow token can only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legacy-web/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npx oxlint .
      - run: npx eslint .
      - run: npx vitest run
      - run: npm run build-only
